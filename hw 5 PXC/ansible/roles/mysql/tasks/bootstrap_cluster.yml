- name: "Start bootstap service on first node"
  ansible.builtin.service:
    name: "mysql@bootstrap"
    state: "started"
    enabled: "no"
  register: mysql_service
  when: ansible_hostname == "pxc-1"

- name: "Start mysql services on nodes"
  ansible.builtin.service:
    name: "mysql"
    state: "started"
    enabled: "yes"
  register: mysql_service
  when: ansible_hostname != "pxc-1"

- name: "Pause 3 seconds to let hosts sync"
  ansible.builtin.pause:
    seconds: 3

- name: "Stop bootstrap on first node"
  ansible.builtin.service:
    name: "mysql@bootstrap"
    state: "stopped"
    enabled: "no"
  register: mysql_service
  when: ansible_hostname == "pxc-1"

- name: "Start mysql service on first node"
  ansible.builtin.service:
    name: "mysql"
    state: "started"
    enabled: "yes"
  register: mysql_service
  when: ansible_hostname == "pxc-1"
