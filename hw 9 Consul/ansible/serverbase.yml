- name: Install and configuration ISCSI
  hosts: iscsi_net
  gather_facts: true
  become: true
  roles:
    - iscsi
  

- name: Install and configuration Pacemaker
  hosts: nodes
  gather_facts: true
  become: true
  roles:
    - gfs2
    - pacemaker
    - angie
    
     
- name: Установка Consul
  hosts: cs_servers,nodes
  become: true
  serial: 3
  roles:
    - { role: consul, tags: consul_tag }

